<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You | Dr. Kapil Akula</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0066cc, #003d7a);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.12);
      padding: 2.5rem;
      border-radius: 14px;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.7;
      opacity: 0.95;
    }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.7rem 1.8rem;
      background: #00b4cc;
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.3s;
    }

    a:hover {
      background: #009fb1;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Thank You for Contacting Us</h1>
    <p>
      Your request has been received successfully.<br>
      Our team will review the details and contact you shortly.
    </p>
    <p>
      For urgent PICU referrals, please call directly:
      <strong>+91-8657150216</strong>
    </p>
    <a href="/">⬅ Back to Home</a>
  </div>
</body>
</html>
